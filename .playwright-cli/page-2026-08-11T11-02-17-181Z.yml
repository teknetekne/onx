      - heading "Privacy Policy" [level=1] [ref=e22]
      - generic [ref=e23]:
        - paragraph [ref=e24]: "Last updated: August 11, 2026"
        - paragraph [ref=e25]:
          - text: This policy explains how information security and privacy are handled during the use of the ONx Ventures website at
          - strong [ref=e26]: onx.ventures
          - text: . The site is provided by Burgan Bank A.Ş. ("Bank").
        - heading "Scope" [level=2] [ref=e27]
        - paragraph [ref=e28]: The policy applies only to the pages within the onx.ventures domain. Links to ON Digital, Burgan Bank, or other third-party websites are subject to the privacy terms of those respective sites.
        - heading "Processed Information" [level=2] [ref=e29]
        - list [ref=e30]:
          - listitem [ref=e31]: Technical data such as IP address, date-time, requested page, browser, and device information that may be included in server and security logs during access to the site,
          - listitem [ref=e32]: Identity, contact, startup, professional experience, and correspondence/attachment information that you voluntarily provide when contacting us using the email link,
        - heading "Purposes of Use" [level=2] [ref=e33]
        - paragraph [ref=e34]: The information is used limited to the purposes of ensuring the safe and uninterrupted operation of the site, preventing misuse, troubleshooting technical issues, responding to contact requests, and pre-evaluating the potential investment or collaboration requests of startups.
        - heading "Sharing and Service Providers" [level=2] [ref=e35]
        - paragraph [ref=e36]: The information may only be shared with authorized teams within the Bank, individuals involved in the evaluation process, technical infrastructure service providers, and authorized public institutions as required by legislation, limited to the purpose. The site loads fonts via Google Fonts and interface icons via unpkg; the standard technical connection information required to transmit these resources may be obtained by the respective providers.
        - heading "Information Security" [level=2] [ref=e37]
        - paragraph [ref=e38]: The Bank implements technical and administrative measures compliant with the risk to prevent unlawful processing and access to the information, and to protect its privacy and integrity. Since the absolute security of any transmission over the internet cannot be guaranteed, we recommend that you do not send sensitive personal data, passwords, financial account information, or third-party data not required for evaluation via email.
        - heading "Cookies and Browser Storage" [level=2] [ref=e39]
        - paragraph [ref=e40]:
          - text: For detailed information about the technologies used on the site, you can review the
          - link "Cookie Notice" [ref=e41] [cursor=pointer]:
            - /url: en-cookie-notice.html
          - text: .
        - heading "Contact and Personal Data" [level=2] [ref=e42]
        - paragraph [ref=e43]:
          - text: Details regarding personal data transmitted via email within the scope of the entrepreneurship program are provided in the
          - link "Entrepreneurship Program Personal Data Disclosure" [ref=e44] [cursor=pointer]:
            - /url: en-data-disclosure.html
          - text: . For your questions, you can write to
          - link "girisimcilikekositemi@on.com.tr" [ref=e45] [cursor=pointer]:
            - /url: mailto:girisimcilikekositemi@on.com.tr
          - text: .
        - heading "Changes" [level=2] [ref=e46]
        - paragraph [ref=e47]: This policy may be updated when technologies, services on the site, or legislation change. The current version and the date of the change are published on this page.
