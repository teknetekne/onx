  - main [ref=e19]:
    - generic [ref=e20]:
      - heading "Gizlilik Politikası" [level=1] [ref=e22]
      - generic [ref=e23]:
        - paragraph [ref=e24]: "Son güncelleme: 11 Ağustos 2026"
        - paragraph [ref=e25]:
          - text: Bu politika,
          - strong [ref=e26]: onx.ventures
          - text: adresindeki ONx Ventures internet sitesinin kullanımı sırasında bilgi güvenliği ve gizliliğin nasıl ele alındığını açıklar. Site, Burgan Bank A.Ş. (“Banka”) tarafından sunulmaktadır.
        - heading "Kapsam" [level=2] [ref=e27]
        - paragraph [ref=e28]: Politika yalnızca onx.ventures alan adı kapsamındaki sayfalar için geçerlidir. ON Dijital, Burgan Bank veya başka üçüncü taraf internet sitelerine verilen bağlantılar, ilgili sitelerin kendi gizlilik koşullarına tabidir.
        - heading "İşlenen bilgiler" [level=2] [ref=e29]
        - list [ref=e30]:
          - listitem [ref=e31]: Siteye erişim sırasında sunucu ve güvenlik kayıtlarında yer alabilecek IP adresi, tarih-saat, istenen sayfa, tarayıcı ve cihaz bilgileri gibi teknik veriler,
          - listitem [ref=e32]: E-posta bağlantısını kullanarak bizimle iletişime geçtiğinizde kendi isteğinizle ilettiğiniz kimlik, iletişim, girişim, mesleki deneyim ve yazışma/ek bilgileri,
        - heading "Kullanım amaçları" [level=2] [ref=e33]
        - paragraph [ref=e34]: Bilgiler; sitenin güvenli ve kesintisiz çalışmasını sağlamak, kötüye kullanımı önlemek, teknik sorunları gidermek, iletişim taleplerini yanıtlamak ve girişimlerin muhtemel yatırım veya iş birliği taleplerini ön değerlendirmeye almak amaçlarıyla sınırlı olarak kullanılır.
        - heading "Paylaşım ve hizmet sağlayıcılar" [level=2] [ref=e35]
        - paragraph [ref=e36]: Bilgiler, yalnızca amaçla sınırlı olmak üzere Banka içindeki yetkili ekiplerle, değerlendirme sürecinde görev alan kişilerle, teknik altyapı hizmet sağlayıcılarıyla ve mevzuat gereği yetkili kamu kurumlarıyla paylaşılabilir. Site yazı tiplerini Google Fonts, arayüz ikonlarını ise unpkg üzerinden yükler; bu kaynakların iletilebilmesi için gerekli standart teknik bağlantı bilgileri ilgili sağlayıcılar tarafından alınabilir.
        - heading "Bilgi güvenliği" [level=2] [ref=e37]
        - paragraph [ref=e38]: Banka; bilgilerin hukuka aykırı işlenmesini ve erişilmesini önlemek, gizlilik ve bütünlüğünü korumak için riskle uyumlu teknik ve idari tedbirler uygular. İnternet üzerinden yapılan hiçbir aktarımın mutlak güvenliği garanti edilemeyeceğinden, e-postayla özel nitelikli kişisel veri, parola, finansal hesap bilgisi veya değerlendirme için gerekli olmayan üçüncü kişi verilerini göndermemenizi öneririz.
        - heading "Çerezler ve tarayıcı depolaması" [level=2] [ref=e39]
        - paragraph [ref=e40]:
          - text: Sitede kullanılan teknolojiler hakkında ayrıntılı bilgi için
          - link "Çerez Aydınlatma Metni" [ref=e41] [cursor=pointer]:
            - /url: cerez-aydinlatma-metni.html
          - text: ’ni inceleyebilirsiniz.
        - heading "İletişim ve kişisel veriler" [level=2] [ref=e42]
        - paragraph [ref=e43]:
          - text: Girişimcilik programı kapsamında e-postayla iletilen kişisel verilere ilişkin ayrıntılar
          - link "Girişimcilik Programı KVKK Aydınlatma Metni" [ref=e44] [cursor=pointer]:
            - /url: girisimcilik-programi-kvkk-aydinlatma-metni.html
          - text: ’nde yer almaktadır. Sorularınız için
          - link "girisimcilikekositemi@on.com.tr" [ref=e45] [cursor=pointer]:
            - /url: mailto:girisimcilikekositemi@on.com.tr
          - text: adresine yazabilirsiniz.
        - heading "Değişiklikler" [level=2] [ref=e46]
        - paragraph [ref=e47]: Bu politika; sitedeki teknolojiler, hizmetler veya mevzuat değiştiğinde güncellenebilir. Güncel sürüm ve değişiklik tarihi bu sayfada yayımlanır.
